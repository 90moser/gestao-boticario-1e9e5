<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O Boticário">

<!-- Ícones para iOS -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">

<!-- Ícones para Android -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- Manifesto PWA -->
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <title>Gestão Revenda O Boticário</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .boticario-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .alert-red { background-color: #fee2e2; border-left: 4px solid #ef4444; }
        .alert-yellow { background-color: #fef3c7; border-left: 4px solid #f59e0b; }
        .alert-green { background-color: #d1fae5; border-left: 4px solid #10b981; }
        .alert-blue { background-color: #dbeafe; border-left: 4px solid #3b82f6; }
        .modal-overlay { background-color: rgba(0,0,0,0.5); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-edit { background-color: #3b82f6; }
        .btn-edit:hover { background-color: #2563eb; }
        .btn-delete { background-color: #ef4444; }
        .btn-delete:hover { background-color: #dc2626; }
        .btn-transfer { background-color: #8b5cf6; }
        .btn-transfer:hover { background-color: #7c3aed; }
        .btn-buy { background-color: #059669; }
        .btn-buy:hover { background-color: #047857; }
        .btn-adjust { background-color: #f59e0b; }
        .btn-adjust:hover { background-color: #d97706; }
        .btn-history { background-color: #6366f1; }
        .btn-history:hover { background-color: #4f46e5; }
        .searchable-dropdown { position: relative; }
        .dropdown-options { max-height: 200px; overflow-y: auto; position: absolute; z-index: 50; width: 100%; background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .dropdown-option { padding: 0.5rem 1rem; cursor: pointer; transition: background-color 0.2s; }
        .dropdown-option:hover { background-color: #f3f4f6; }
        .dropdown-option.selected { background-color: #667eea; color: white; }
        .filter-bar { background: linear-gradient(to right, #f8fafc, #f1f5f9); }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <!-- Utilitários e Firebase (scripts regulares — vars ficam no escopo global) -->
    <script src="js/firebase.js"></script>
    <script src="js/utils.js"></script>

    <!-- Componentes e App (Babel transpila JSX) -->
    <script type="text/babel" src="js/components.js"></script>
    <script type="text/babel" src="js/App.js"></script>
</body>
</html>
